# The actual CI lives in shouni/workflows; its README explains the job layout and how tags are used.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # fuzz-targets is empty. Nothing in this module parses externally supplied values on its own
    # (the Accept check only looks for a substring, CSP and Role assemble configured values,
    # and staticfiles leaves path resolution to net/http).
    uses: shouni/workflows/.github/workflows/go-ci.yml@v1
